<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>갑옷 속의 유령</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0a10; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { width: min(100vw, calc(100vh * 16 / 9)); height: min(100vh, calc(100vw * 9 / 16)); image-rendering: pixelated; background: #000; }
</style>
</head>
<body>
<canvas id="screen" width="960" height="540"></canvas>
<script>
"use strict";
/* =====================================================================================
   갑옷 속의 유령 — 2단계 (투구 4개 / 적 4종 / 웨이브 전투 방 3개)
   배경만 png, 캐릭터·적·이펙트는 전부 코드로 픽셀을 그린다.
   이펙트는 pixelfx(MIT, Sprite Fusion의 Hugo Duprez 기법 기반)의 방식을 옮겨 썼다:
   색 레이어 + 가산 빛 레이어, 속도만큼 늘어나는 불꽃, 1~2프레임 흰 섬광, 타격 정지.
   ===================================================================================== */

// ---------- 기본 설정 ----------
const W = 480, H = 270, SCALE = 2, FLOOR = 238, ROOM_L = 12, ROOM_R = W - 12;
const GRAV = 1100, STEP = 1 / 120;
const BASE = {            // 기획서 "기본 능력치 (투구 공통)"
  maxHp: 100, speed: 120, jumpV: -330, jumps: 2,
  dashCharges: 2, dashRecharge: 1.2, dashInvuln: 0.25, dashTime: 0.16, dashSpeed: 380,
  hurtInvuln: 0.8, swapCd: 8, critChance: 0.05, critMult: 1.5,
};

const screen = document.getElementById("screen"), sctx = screen.getContext("2d");
const mk = (w, h) => { const c = document.createElement("canvas"); c.width = w; c.height = h; return c; };
const buf = mk(W, H), g = buf.getContext("2d");          // 색 레이어 (저해상도)
const lightC = mk(W, H), lg = lightC.getContext("2d");   // 빛 레이어 (가산 합성)
const SP = 128, SX = 64, SY = 100;                       // 캐릭터 한 명을 그리는 임시 판과 발 위치
const spr = mk(SP, SP), sg = spr.getContext("2d", { willReadFrequently: true });
const bg = new Image(); bg.src = "assets/bg_burning_village.png";

const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = (arr) => arr[(Math.random() * arr.length) | 0];

// ---------- 픽셀 붓 ----------
// R: 사각형, E: 타원. 기본은 임시 판(발 기준 좌표, 오른쪽을 봄)에 그리고, world()로 감싸면 화면에 바로 그린다.
let T = sg, TX = SX, TY = SY;
const R = (x, y, w, h, c) => { T.fillStyle = c; T.fillRect(TX + Math.round(x), TY + Math.round(y), w, h); };
function E(cx, cy, rx, ry, c) {
  T.fillStyle = c; cx = Math.round(cx); cy = Math.round(cy);
  for (let dy = -ry; dy <= ry; dy++) { const hw = Math.round(rx * Math.sqrt(1 - (dy / (ry + 0.5)) ** 2)); T.fillRect(TX + cx - hw, TY + cy + dy, hw * 2 + 1, 1); }
}
function at(dx, dy, fn) { const ox = TX, oy = TY; TX += Math.round(dx); TY += Math.round(dy); fn(); TX = ox; TY = oy; }
function world(x, y, fn) { const t = T, ox = TX, oy = TY; T = g; TX = Math.round(x); TY = Math.round(y); fn(); T = t; TX = ox; TY = oy; }
const begin = () => sg.clearRect(0, 0, SP, SP);
// 그려진 모양 바깥에 1픽셀 어두운 테두리를 자동으로 두른다
function outline() {
  const im = sg.getImageData(0, 0, SP, SP), d = im.data, src = new Uint8Array(SP * SP);
  for (let i = 0; i < SP * SP; i++) src[i] = d[i * 4 + 3] > 0 ? 1 : 0;
  for (let y = 1; y < SP - 1; y++) for (let x = 1; x < SP - 1; x++) {
    const i = y * SP + x;
    if (!src[i] && (src[i - 1] || src[i + 1] || src[i - SP] || src[i + SP])) { const j = i * 4; d[j] = 23; d[j + 1] = 19; d[j + 2] = 28; d[j + 3] = 255; }
  }
  sg.putImageData(im, 0, 0);
}
function whiten() { sg.globalCompositeOperation = "source-atop"; sg.fillStyle = "#fff"; sg.fillRect(0, 0, SP, SP); sg.globalCompositeOperation = "source-over"; }
function blit(c, x, y, dir) { g.save(); g.translate(Math.round(x), Math.round(y)); g.scale(dir, 1); g.drawImage(c, -SX, -SY); g.restore(); }
// 일렁이는 불꽃: 기둥마다 높이가 흔들리고, 안쪽으로 갈수록 밝다
function flame(x, y, w, h, t, cols) {
  for (let dx = -w; dx <= w; dx++) {
    const u = 1 - (dx / (w + 0.6)) ** 2, wob = 0.72 + 0.28 * Math.sin(t * 13 + dx * 1.9 + x);
    const hh = Math.max(1, Math.round(h * u * wob)), sway = Math.round(Math.sin(t * 7 + x) * (hh / h) * 1.2);
    R(x + dx, y - hh, 1, hh, cols[0]);
    if (Math.abs(dx) < w) { const h1 = Math.round(hh * 0.68); R(x + dx, y - h1, 1, h1, cols[1]); }
    if (Math.abs(dx) < w - 1) { const h2 = Math.round(hh * 0.38); R(x + dx, y - h2, 1, h2, cols[2]); }
    if (dx === 0) R(x + sway, y - hh - 1, 1, 2, cols[0]);
  }
  const f = (t * 9) | 0; R(x + ((f * 3) % 5) - 2, y - h - 2 - (f % 3), 1, 1, cols[1]);
}

// ---------- 색 ----------
const C = {
  line: "#17131c", dark: "#0c0a10", iron0: "#2a2531", iron1: "#433c4b", iron2: "#62596b", iron3: "#8a8094", iron4: "#b0a8ba",
  rust: "#9a4f28", rust2: "#c9783a", cape: "#2f8188", cape2: "#1d5459", cape3: "#44a3a6", gold: "#d1aa4e",
  flame0: "#2f8fb8", flame1: "#63c8ea", flame2: "#b5efff", white: "#ffffff",
  wood: "#6a3f24", wood2: "#9c6a3c", steel: "#c8ccd6", steel2: "#8e94a6",
  skin: "#e0b088", skin2: "#b98660", cloth: "#8a6a44", cloth2: "#654a2f", cloth3: "#a98858", boot: "#3a2a22",
  green: "#4f7a3a", green2: "#35582b", green3: "#6d9a4c", cream: "#e8dcc0",
  purple: "#6a3f96", purple2: "#8a5cc0", purple3: "#4a2a6c", red: "#d8423a", red2: "#8e2a2a",
  fur: "#6b4a34", fur2: "#4a3226", fur3: "#8a6648",
};
const GHOST = [C.flame0, C.flame1, C.flame2], FIRE = ["#c9281f", "#f2701f", "#ffe27a"];
const RAMP_GHOST = ["#12324a", "#2f8fb8", "#63c8ea", "#b5efff", "#ffffff"];
const RAMP_FIRE = ["#4a1712", "#c9281f", "#f2561d", "#ffae35", "#ffe27a"];
const RAMP_IRON = ["#3a2412", "#a4552b", "#e08a3c", "#ffd27a", "#ffffff"];
const RAMP_LEAF = ["#1c3212", "#4f7a3a", "#8fc05a", "#e2f0a0", "#ffffff"];
const RAMP_MAGE = ["#2a1648", "#6a3f96", "#a070e0", "#e0c8ff", "#ffffff"];

// 투구 안쪽 얼굴: 어두운 틈과 푸른 눈
function visor() { R(-1, -8, 9, 5, C.dark); R(1, -7, 2, 3, C.flame2); R(5, -7, 2, 3, C.flame2); R(1, -7, 2, 1, C.white); R(5, -7, 2, 1, C.white); }
function hood() { E(0, -5, 6, 5, C.iron0); E(-1, -6, 4, 3, C.iron1); visor(); }

// =====================================================================================
//  투구 목록 — 투구를 추가하려면 이 배열에 항목 하나만 더 넣으면 된다.
//  draw: 머리 그림(목깃 중심이 0,0) / weapon: 손에 든 무기 / basic: 기본 공격 콤보
//  skills[0] = A키, skills[1] = S키 / swap: 교체해 들어올 때 나가는 공격 / cdMult: 스킬 쿨 배율
//  행동 함수(use, fire)는 아래 "행동 도구"(startAct, melee, shot, blast, spawn...)만 써서 조립한다.
// =====================================================================================
const HELMETS = [
  {
    id: "empty", name: "빈 투구", grade: "기본", type: "밸런스", ramp: RAMP_GHOST,
    draw(t) {
      flame(-1, -11, 2, 6, t, GHOST);
      E(0, -6, 7, 6, C.iron1); E(-1, -8, 5, 4, C.iron2); E(-2, -10, 3, 1, C.iron3);
      R(-7, -4, 15, 2, C.iron0); R(-6, -2, 13, 1, C.rust);
      visor(); R(-2, -9, 10, 1, C.iron3); R(-2, -3, 10, 1, C.iron2);
      R(-6, -7, 2, 2, C.iron3); R(-6, -6, 1, 1, C.gold); R(-3, -11, 1, 1, C.dark); R(-4, -10, 3, 1, C.dark); R(4, -11, 2, 1, C.rust2); R(-5, -4, 2, 1, C.rust2);
    },
    weapon() {},
    basic: { steps: [                             // 주먹 3연타, 각 10
      { dur: 0.22, hitT: 0.07, dmg: 10, reach: 20, pose: "punch", lunge: 40 },
      { dur: 0.22, hitT: 0.07, dmg: 10, reach: 20, pose: "punch", lunge: 40 },
      { dur: 0.34, hitT: 0.10, dmg: 10, reach: 24, pose: "punch", lunge: 70, heavy: true },
    ] },
    skills: [
      { name: "투구 던지기", cd: 5, icon() { E(0, 0, 4, 4, C.iron2); R(-1, -1, 5, 2, C.flame2); R(-8, -2, 3, 1, C.white); R(-7, 1, 2, 1, C.white); },
        use(p) {
          startAct(p, { dur: 0.2, pose: "punch", reach: 14, events: [{ t: 0.06, fn() {
            p.headless = true;
            spawn({ kind: "helm", x: p.x + p.dir * 10, y: p.y - 24, vx: p.dir * 300, vy: -90, dmg: 25, hit: new Set(), rest: false, age: 0 });
          } }] });
        } },
      { name: "갑옷 박치기", cd: 8, icon() { E(-2, 0, 4, 4, C.iron2); R(3, -2, 2, 4, C.white); R(6, -4, 1, 2, C.white); R(6, 2, 1, 2, C.white); R(7, -1, 2, 2, C.white); },
        use(p) {
          const hit = new Set();
          startAct(p, { dur: 0.3, pose: "ram", vx: 330, ghost: true, tick() { melee(p, { x0: 0, x1: 20, y0: -30, y1: 0, dmg: 30, kb: 190, stun: 0.5, heavy: true, once: hit }); } });
          dust(p.x, FLOOR, -p.dir, 6);
        } },
    ],
    swap: { name: "갑옷 낙하", use(p) {           // 갑옷째 떨어지며 주변 20
      p.vy = Math.max(p.vy, 500);
      startAct(p, { dur: 0.3, pose: "slam", events: [{ t: 0.08, fn() {
        melee(p, { x0: -40, x1: 40, y0: -36, y1: 4, dmg: 20, kb: 160, heavy: true, swap: true });
        fxRing(p.x, FLOOR, 42, p.helm.ramp); dust(p.x, FLOOR, 1, 5); dust(p.x, FLOOR, -1, 5); shake(3, 0.2);
      } }] });
    } },
  },
  {
    id: "soldier", name: "병사 투구", grade: "녹슨", type: "파워", ramp: RAMP_IRON,
    draw(t) {
      flame(0, -15, 2, 5, t, GHOST);
      hood();
      E(0, -12, 6, 4, C.iron2); E(-1, -14, 4, 2, C.iron3); R(-2, -16, 3, 1, C.iron4);
      E(0, -9, 11, 2, C.iron1); R(-10, -10, 21, 1, C.iron3); R(-9, -8, 19, 1, C.iron0);
      R(-4, -12, 1, 1, C.iron0); R(0, -12, 1, 1, C.iron0); R(4, -12, 1, 1, C.iron0); R(3, -14, 2, 1, C.rust2); R(-8, -9, 3, 1, C.rust); R(6, -9, 2, 1, C.rust2);
    },
    weapon(hx, hy, acting) {                      // 창: 평소엔 세워 들고, 공격 중엔 앞으로 겨눈다
      if (acting) { R(hx - 16, hy, 32, 2, C.wood); R(hx - 16, hy, 32, 1, C.wood2); R(hx + 13, hy - 1, 3, 4, C.cloth3); R(hx + 16, hy - 2, 4, 6, C.steel2); R(hx + 17, hy - 1, 5, 4, C.steel); R(hx + 22, hy, 2, 2, C.white); }
      else { R(hx, hy - 24, 2, 32, C.wood); R(hx, hy - 24, 1, 32, C.wood2); R(hx - 1, hy - 23, 4, 3, C.cloth3); R(hx - 2, hy - 28, 6, 5, C.steel2); R(hx - 1, hy - 31, 4, 7, C.steel); R(hx, hy - 33, 2, 3, C.white); }
    },
    basic: { steps: [                             // 창 2연타, 각 16, 길고 느림. 3번째마다 1.5배
      { dur: 0.42, hitT: 0.16, dmg: 16, reach: 42, pose: "thrust", lunge: 50 },
      { dur: 0.50, hitT: 0.18, dmg: 16, reach: 46, pose: "thrust", lunge: 80, heavy: true },
    ], nth: { every: 3, mult: 1.5 } },
    skills: [
      { name: "창 돌격", cd: 7, icon() { R(-8, 0, 13, 1, C.wood2); R(4, -1, 4, 3, C.steel); R(-8, -3, 4, 1, C.white); R(-8, 3, 4, 1, C.white); },
        use(p) {
          const hit = new Set();                // 3칸(96px) 돌진, 경로의 적에게 35
          startAct(p, { dur: 0.24, pose: "thrust", reach: 30, vx: 400, ghost: true, tick() { melee(p, { x0: 0, x1: 36, y0: -24, y1: -2, dmg: 35, kb: 120, heavy: true, once: hit }); } });
          dust(p.x, FLOOR, -p.dir, 6);
        } },
      { name: "창벽", cd: 12, icon() { for (const x of [-5, -1, 3]) { R(x, -3, 1, 8, C.wood2); R(x - 1, -6, 3, 3, C.steel); } },
        use(p) {                                 // 창 3개, 2초간 매초 12, 밀어냄
          startAct(p, { dur: 0.3, pose: "slam", events: [{ t: 0.1, fn() { spawn({ kind: "wall", x: p.x + p.dir * 30, dir: p.dir, life: 2, tickT: 0, dmg: 12, rise: 0 }); shake(2, 0.12); } }] });
        } },
    ],
    swap: { name: "창 내리꽂기", use(p) {        // 위에서 창을 내리꽂아 30
      spawn({ kind: "skySpear", x: clamp(p.x + p.dir * 26, ROOM_L, ROOM_R), y: FLOOR - 150, dir: p.dir, dmg: 30, done: false, life: 0.7 });
      startAct(p, { dur: 0.25, pose: "slam" });
    } },
  },
  {
    id: "hunter", name: "사냥꾼 모자", grade: "녹슨", type: "스피드", ramp: RAMP_LEAF,
    draw(t) {
      hood();
      for (let i = 0; i < 9; i++) { R(-7 - i, -13 - i, 3, 2, i % 3 === 2 ? C.cloth3 : C.cream); R(-6 - i, -13 - i, 1, 1, C.cloth); }   // 깃털
      R(-7, -14, 13, 5, C.green); R(-6, -17, 10, 3, C.green); R(-6, -19, 7, 2, C.green); R(-5, -20, 4, 1, C.green3);
      R(-6, -17, 3, 3, C.green2); R(1, -18, 2, 2, C.green3); R(-7, -12, 13, 2, C.wood); R(-1, -12, 3, 2, C.gold);
      E(0, -9, 11, 2, C.green); R(-10, -10, 21, 1, C.green3); R(-9, -8, 19, 1, C.green2); R(7, -9, 2, 1, C.green2); R(-11, -8, 2, 2, C.green2);
    },
    weapon(hx, hy, acting) {                      // 활
      for (let i = -9; i <= 9; i++) { const x = hx + 2 + Math.round(4 * (1 - (i / 9) ** 2)); R(x, hy + i, 2, 1, Math.abs(i) > 6 ? C.cloth3 : C.wood2); }
      const pull = acting ? -4 : 0;
      for (let i = -9; i <= 9; i++) R(hx + 2 + Math.round(pull * (1 - Math.abs(i) / 9)), hy + i, 1, 1, C.steel);
      if (acting) { R(hx - 3, hy, 12, 1, C.cream); R(hx + 9, hy - 1, 2, 3, C.steel); }
    },
    basic: { steps: [                             // 화살 1발 9, 빠른 연사. 멀수록 최대 +30%
      { dur: 0.2, hitT: 0.06, pose: "shoot", reach: 6, fire(p) { shot(p, { dmg: 9, vx: 440, look: "arrow", far: 0.3 }); } },
    ] },
    skills: [
      { name: "덫 설치", cd: 8, icon() { R(-6, 2, 13, 2, C.steel2); for (const x of [-5, -2, 1, 4]) { R(x, -1, 2, 3, C.steel); R(x, -2, 1, 1, C.white); } },
        use(p) {
          startAct(p, { dur: 0.25, pose: "slam", events: [{ t: 0.1, fn() { objs = objs.filter((o) => o.kind !== "trap"); spawn({ kind: "trap", x: p.x + p.dir * 14, age: 0 }); dust(p.x + p.dir * 14, FLOOR, 0, 3); } }] });
        } },
      { name: "화살비", cd: 14, icon() { for (const [x, y] of [[-5, -4], [0, -1], [4, -5], [-2, 3]]) { R(x, y, 1, 5, C.cream); R(x - 1, y + 4, 3, 2, C.steel); } },
        use(p) {                                 // 앞쪽 넓은 범위에 2초간 8발, 각 10
          startAct(p, { dur: 0.3, pose: "shoot", reach: 4, events: [{ t: 0.1, fn() { spawn({ kind: "rain", x0: p.x + p.dir * 30, x1: p.x + p.dir * 150, dir: p.dir, t: 0, n: 0 }); } }] });
        } },
    ],
    swap: { name: "뒤로 뛰며 3연사", use(p) {     // 뒤로 점프하며 화살 3발 부채꼴
      p.vy = -210; p.ground = false;
      startAct(p, { dur: 0.3, pose: "shoot", reach: 6, vx: -230, air: true, events: [{ t: 0.05, fn() { for (const a of [-0.22, 0, 0.22]) shot(p, { dmg: 9, vx: 440 * Math.cos(a), vy: 440 * Math.sin(a) + 40, look: "arrow", far: 0.3 }); } }] });
    } },
  },
  {
    id: "mage", name: "견습 마법사 고깔", grade: "녹슨", type: "밸런스", ramp: RAMP_MAGE, cdMult: 0.85,   // 패시브: 스킬 쿨 -15%
    draw(t) {
      hood();
      const rows = [[-7, 13], [-7, 12], [-7, 11], [-7, 10], [-7, 9], [-8, 9], [-8, 8], [-9, 8], [-9, 7], [-10, 6], [-11, 6], [-12, 5], [-13, 5], [-14, 4]];
      rows.forEach(([x, w], i) => { R(x, -11 - i, w, 1, C.purple); R(x, -11 - i, 2, 1, C.purple3); R(x + w - 2, -11 - i, 1, 1, C.purple2); });
      R(-16, -23, 4, 3, C.purple); R(-17, -21, 2, 3, C.purple3);
      R(-2, -17, 3, 1, C.gold); R(-1, -18, 1, 3, C.gold); R(-7, -12, 13, 1, C.cloth3); R(-8, -11, 2, 2, C.cloth3);
      E(0, -9, 12, 2, C.purple); R(-11, -10, 23, 1, C.purple2); R(-10, -8, 21, 1, C.purple3); R(9, -9, 2, 1, C.purple3); R(-13, -8, 2, 2, C.purple3);
    },
    weapon(hx, hy, acting, t) {                   // 지팡이
      R(hx, hy - 18, 2, 26, C.wood); R(hx, hy - 18, 1, 26, C.wood2); R(hx - 2, hy - 21, 2, 4, C.wood2); R(hx + 2, hy - 21, 2, 4, C.wood2); R(hx - 2, hy - 18, 6, 1, C.wood);
      flame(hx + 1, hy - 20, 2, acting ? 9 : 6, t, GHOST);
    },
    basic: { steps: [                             // 마법탄 1발 12 마법, 느린 연사
      { dur: 0.38, hitT: 0.12, pose: "cast", reach: 8, fire(p) { shot(p, { dmg: 12, vx: 270, look: "bolt" }); } },
    ] },
    skills: [
      { name: "불꽃 화살", cd: 4, icon() { R(-7, 0, 9, 1, "#ffe27a"); R(-5, -1, 6, 3, "#f2701f"); R(1, -2, 5, 5, "#ffae35"); R(3, -1, 4, 3, "#fff"); },
        use(p) {                                 // 직선 관통 28 마법 + 화상

  ["A", "S"].forEach((kname, i) => { const s = HUD.skill[i]; txt(kname, s.x + 1, s.y + 5, 10, "#ffe27a"); if (cds[i] > 0) txt(cds[i].toFixed(1), s.x + 9, s.y + 13, 13, "#fff", "center"); });
  txt(p.swapCd > 0 ? p.swapCd.toFixed(1) : "Space", HUD.sub.x + 8, HUD.sub.y + 23, 10, p.swapCd > 0 ? "#fff" : "#ffe27a", "center");
  txt("Z", HUD.dash.x + 21, HUD.dash.y + 5, 10, "#ffe27a");
  txt("←→ 이동   C 점프(2단)   Z 대시   X 공격   A·S 스킬   Space 투구 교체   ↑ 줍기·문   R 다시 시작", W / 2, H - 5, 11, "#d0c8dc", "center");
  for (const t of texts) txt(t.s, t.x, t.y, t.big ? 18 : 13, t.c, "center");
  for (const o of objs) {
    if (o.kind === "pickup") { txt(helmById(o.id).name, o.x, FLOOR - 46, 11, "#fff", "center"); if (Math.abs(o.x - p.x) < 16) txt("↑ 지금 투구와 바꾸기", o.x, FLOOR - 55, 11, "#ffe27a", "center"); }
    if (o.kind === "door") txt(Math.abs(o.x - p.x) < 18 ? "↑ 다음 방으로" : "다음 방", o.x, FLOOR - 58, 11, "#ffe27a", "center");
  }
  const alive = enemies.filter((e) => !e.dead).length;
  txt(`전투 방 ${room + 1} / ${ROOMS.length}`, W - 8, 15, 12, "#fff", "right");
  txt(phase === "fight" ? `웨이브 ${wave + 1} / ${ROOMS[room].length} · 적 ${alive}` : "방 클리어", W - 8, 25, 11, "#d0c8dc", "right");
  if (banner && banner.t > 0 && state === "play") { c.globalAlpha = clamp(banner.t / 0.4); txt(banner.s, W / 2, 70, 20, "#ffe27a", "center"); c.globalAlpha = 1; }
  if (state !== "play") {
    c.fillStyle = "rgba(8,6,14,0.55)"; c.fillRect(0, 0, W * S, H * S);
    txt(state === "clear" ? "전투 방 3개 돌파!" : "보이드가 쓰러졌다…", W / 2, H / 2 - 6, 34, state === "clear" ? "#ffe27a" : "#ff6a5a", "center");
    txt("R 키로 다시 시작", W / 2, H / 2 + 16, 16, "#fff", "center");
  }
}

// =====================================================================================
//  메인 루프
// =====================================================================================
function update(dt) {
  for (const k in pressed) pressed[k] -= dt;
  if (take("KeyR")) { reset(); return; }
  shakeT = Math.max(0, shakeT - dt); whiteT = Math.max(0, whiteT - dt);
  if (hitstop > 0) { hitstop -= dt; return; }     // 타격 정지: 모두 멈춘다
  time += dt; if (banner) banner.t -= dt;
  if (state === "play") updatePlayer(dt);
  else { const p = player; p.vx = 0; p.vy += GRAV * dt; p.y = Math.min(FLOOR, p.y + p.vy * dt); p.act = null; p.dashing = 0; }
  for (const e of enemies) updateEnemy(e, dt);
  enemies = enemies.filter((e) => e.dead < 0.5);
  updateObjs(dt); updateFx(dt);
  // 웨이브 → 방 클리어 → 보상 투구 + 문
  if (state === "play" && phase === "fight" && enemies.length === 0) {
    waveT += dt;
    if (waveT > 0.7) {
      waveT = 0;
      if (wave + 1 < ROOMS[room].length) { wave++; startWave(); }
      else if (room + 1 >= ROOMS.length) state = "clear";
      else {
        phase = "clear"; banner = { s: "방 클리어!", t: 1.8 };
        const rest = HELMETS.filter((h) => !player.slots.includes(h.id));
        if (rest.length) { spawn({ kind: "pickup", id: pick(rest).id, x: 240 }); light(240, FLOOR - 16, 60, "#fff", 0.7, 0.4); }
        spawn({ kind: "door", x: 440 });
      }
    }
  }
}
// 배경 불빛이 일렁이는 자리 (배경 그림의 불 위치)
const FIRES = [[30, 40, 90], [118, 70, 70], [165, 138, 60], [245, 140, 70], [318, 150, 50], [455, 95, 80], [300, 215, 60]];
const vignette = mk(W, H); { const v = vignette.getContext("2d"), gr = v.createRadialGradient(W / 2, H * 0.55, 90, W / 2, H * 0.55, 330); gr.addColorStop(0, "rgba(0,0,0,0)"); gr.addColorStop(1, "rgba(6,3,14,0.62)"); v.fillStyle = gr; v.fillRect(0, 0, W, H); }
function shadow(x, w) { x = Math.round(x); g.fillStyle = "rgba(8,4,14,0.4)"; g.fillRect(x - w, FLOOR, w * 2, 2); g.fillRect(x - w + 2, FLOOR + 2, w * 2 - 4, 1); g.fillRect(x - w + 2, FLOOR - 1, w * 2 - 4, 1); }
function render() {
  g.clearRect(0, 0, W, H); lg.clearRect(0, 0, W, H);
  if (bg.complete && bg.naturalWidth) g.drawImage(bg, 0, 0, W, H); else { g.fillStyle = "#241c33"; g.fillRect(0, 0, W, H); g.fillStyle = "#3a3346"; g.fillRect(0, FLOOR, W, H - FLOOR); }
  g.fillStyle = "rgba(14,10,24,0.3)"; g.fillRect(0, 0, W, H);      // 배경을 살짝 눌러 캐릭터가 잘 보이게
  FIRES.forEach(([x, y, r], i) => glow(x, y, r * (1 + 0.08 * Math.sin(time * 9 + i * 2.3)), "#ff7a2a", 0.16 + 0.05 * Math.sin(time * 13 + i * 1.7) + 0.03 * Math.sin(time * 31 + i)));
  for (const m of embers) if (!m.near) { g.fillStyle = Math.sin(time * 5 + m.ph) > 0 ? "#ffae35" : "#f2561d"; g.fillRect(Math.round(m.x), Math.round(m.y), 1, 1); }
  drawFxBack(); drawObjs(true);
  for (const e of enemies) {
    if (e.dead > 0.25) continue;
    if (e.born > 0) { const k = e.born * 2; glow(e.x, FLOOR - 12, 22, "#8a5cc0", 0.5); g.fillStyle = "#b08ae0"; for (let i = 0; i < 6; i++) g.fillRect(Math.round(e.x + Math.cos(time * 9 + i) * 10 * k), Math.round(FLOOR - 12 + Math.sin(time * 9 + i) * 12 * k), 2, 2); continue; }
    shadow(e.x, e.type.low ? 10 : 8);
    drawEnemySprite(e); blit(spr, e.x, e.y, e.dir);
    if (e.burn > 0) glow(e.x, e.y - 12, 18, "#ff8a2a", 0.35);
    if (!e.dead && e.hp < e.maxHp) { const yy = Math.round(e.y) - (e.type.low ? 26 : 44), xx = Math.round(e.x); g.fillStyle = C.line; g.fillRect(xx - 10, yy, 20, 4); g.fillStyle = "#c9342c"; g.fillRect(xx - 9, yy + 1, Math.round(18 * e.hp / e.maxHp), 2); }
  }
  drawObjs(false);
  const p = player;
  shadow(p.x, 10);
  if (!(p.blink > 0 && ((time * 20) | 0) % 2)) { drawPlayerSprite(p); blit(spr, p.x, p.y, p.dir); }
  glow(p.x + p.dir * 2, p.y - 30, 18, C.flame1, 0.3); glow(p.x, p.y - 12, 34, C.flame0, 0.12);
  drawFxFront();
  for (const m of embers) if (m.near) { g.fillStyle = "#ffd27a"; g.fillRect(Math.round(m.x), Math.round(m.y), 2, 2); glow(m.x, m.y, 6, "#ff8a2a", 0.4); }
  g.drawImage(vignette, 0, 0);
  if (whiteT > 0) { lg.fillStyle = "rgba(190,230,255,0.35)"; lg.fillRect(0, 0, W, H); }
  g.globalCompositeOperation = "lighter"; g.drawImage(lightC, 0, 0); g.globalCompositeOperation = "source-over";
  // 화면으로 (흔들림 적용) + HUD
  const k = shakeT > 0 ? shakeAmp * (shakeT / shakeDur) : 0, ox = Math.round(rnd(-k, k)), oy = Math.round(rnd(-k, k));
  sctx.imageSmoothingEnabled = false; sctx.fillStyle = "#000"; sctx.fillRect(0, 0, screen.width, screen.height);
  sctx.drawImage(buf, ox * SCALE, oy * SCALE, W * SCALE, H * SCALE);
  g.clearRect(0, 0, W, H); lg.clearRect(0, 0, W, H); drawHud();
  g.globalCompositeOperation = "lighter"; g.drawImage(lightC, 0, 0); g.globalCompositeOperation = "source-over";
  sctx.drawImage(buf, 0, 0, W * SCALE, H * SCALE);
  drawHudText();
}

let last = 0, acc = 0;
function frame(now) {
  acc += Math.min(0.05, (now - last) / 1000 || 0); last = now;
  while (acc >= STEP) { update(STEP); acc -= STEP; }
  render(); requestAnimationFrame(frame);
}
reset(); requestAnimationFrame(frame);
// 시험용 손잡이
window.__game = { get player() { return player; }, get enemies() { return enemies; }, get state() { return state; }, get room() { return room; }, get wave() { return wave; }, get objs() { return objs; },
  lineup() { enemies = ["militia", "torch", "shield", "hound"].map((id, i) => Object.assign(newEnemy(id, 200 + i * 60), { born: 0, speed: 0, t: 99, dir: -1 })); } };
</script>
